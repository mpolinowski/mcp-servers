[project]
name = "invoice-extractor"
version = "0.1.0"
description = "MCP server + LangChain ReactAgent that extracts invoice data (JSON + HTML/Markdown) from images via the local GLM-OCR model"
readme = "README.md"
authors = [
    { name = "Mike Polinowski", email = "mpolinowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "fastmcp>=4.2.3",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "markdownify>=1.2.4",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "opencv-python>=5.1.0.95",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
invoice-extractor = "invoice_extractor:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
