[project]
name = "agent_terminal_tools"
version = "0.1.0"
description = "A MCP server that adds terminal tools to your agent."
readme = "README.md"
authors = [
    { name = "Mike Polinowski", email = "mpolinowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.11",
    "langchain-mcp-adapters>=0.3.1",
]

[project.scripts]
agent_terminal_tools = "agent_terminal_tools.main:main" # link agent_terminal_tools to execute your main()

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build" # use uv build command to build the package

[tool.uv_build.packages.find]
where = ["src"] # where is the src code to build from - defaults to ./src, just being verbose here
